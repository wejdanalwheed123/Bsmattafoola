<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بصمة طفولة – اليوم العالمي للطفل</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pur:#2f2557;--pur2:#4a3d80;--coral:#ff6b6b;--sun:#ffd166;--mint:#06d6a0;--sky:#4cc9f0;--pink:#ff8fc7;--cream:#fffbf3;--ink:#2f2557;--mute:#6d6888;--line:#ece6f5}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--cream);color:var(--ink);line-height:1.9;font-size:16px;overflow-x:hidden}
h1,h2,h3,.nav a,.btn{font-family:'Readex Pro',sans-serif}
.wrap{max-width:1080px;margin:auto;padding:0 22px;position:relative}
a{color:inherit;text-decoration:none}
/* nav */
.nav{position:sticky;top:0;z-index:30;background:rgba(255,251,243,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:12px}
.logo{height:54px;width:auto}
.links{display:flex;gap:20px;font-size:14px}
.links a{color:var(--pur2);position:relative}
.links a:hover{color:var(--coral)}
.right{display:flex;gap:8px;align-items:center}
.lang{border:2px solid var(--pur);background:none;color:var(--pur);border-radius:30px;padding:3px 14px;font-family:'Readex Pro';font-size:13px;cursor:pointer}
.menu{display:none;background:none;border:0;font-size:26px;color:var(--pur);cursor:pointer}
@media(max-width:940px){.links{display:none;position:absolute;top:70px;inset-inline:0;flex-direction:column;background:var(--cream);padding:14px 22px;gap:12px;border-bottom:1px solid var(--line)}.links.open{display:flex}.menu{display:block}}
/* hero */
.hero{padding:70px 0 120px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#e8f8ff 0%,#fff3f8 60%,var(--cream) 100%)}
.balloons{position:absolute;inset:0;pointer-events:none}
.bl{position:absolute;bottom:-160px;width:70px;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-55vh) rotate(4deg)}100%{transform:translateY(-120vh) rotate(-4deg)}}
.eyebrow{display:inline-block;font-family:'Readex Pro';font-size:14px;background:var(--sun);padding:4px 18px;border-radius:30px;margin-bottom:18px;transform:rotate(-2deg)}
.hero h1{font-size:clamp(46px,9.5vw,90px);line-height:1.15;position:relative}
.hero h1 .a{color:var(--coral)}.hero h1 .b{color:var(--pur)}
.hero .sub{font-size:clamp(17px,2.4vw,21px);color:var(--mute);max-width:620px;margin:16px auto 30px;position:relative}
.btn{display:inline-block;padding:12px 28px;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;border:0;transition:.2s;position:relative}
.btn.p{background:var(--coral);color:#fff;box-shadow:0 6px 0 #d94f4f}.btn.p:hover{transform:translateY(-2px)}
.btn.s{background:#fff;color:var(--pur);border:2px solid var(--pur);margin-inline-start:8px}
.kids{font-size:44px;margin-top:34px;letter-spacing:8px;position:relative}
.kids span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
.kids span:nth-child(2){animation-delay:.2s}.kids span:nth-child(3){animation-delay:.4s}.kids span:nth-child(4){animation-delay:.6s}.kids span:nth-child(5){animation-delay:.8s}
@keyframes hop{50%{transform:translateY(-12px)}}
.wave{position:absolute;bottom:-1px;left:0;width:100%;height:70px}
/* sections */
section{padding:80px 0}
.head{max-width:640px;margin-bottom:38px}
.k{display:inline-block;font-family:'Readex Pro';font-size:13px;font-weight:600;padding:2px 14px;border-radius:20px;color:#fff}
.head h2{font-size:clamp(28px,4.5vw,40px);line-height:1.3;margin:10px 0 8px}
.head p{color:var(--mute)}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.box{background:#fff;border:2px solid var(--line);border-radius:24px;padding:26px;transition:.25s}
.box:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(47,37,87,.08)}
.box .n{font-family:'Readex Pro';font-size:36px;font-weight:700;line-height:1.2}
.box h3{font-size:18px;margin:8px 0 6px}
.box p{color:var(--mute);font-size:15px}
.ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
.tint1{background:#eafaf5}.tint2{background:#fff5e0}.tint3{background:#eef6ff}
/* rights flip (playful) */
.rights{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}
.card{perspective:900px;height:200px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;border:3px solid var(--pur);box-shadow:6px 6px 0 var(--pur)}
.front .ic{font-size:54px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
.front h3{font-size:20px;margin-top:6px}
.back{transform:rotateY(180deg);background:#fff;font-size:16px}
.hint{text-align:center;color:var(--mute);font-size:14px;margin-top:18px}
/* passport */
.pp-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:30px;align-items:start}
@media(max-width:800px){.pp-wrap{grid-template-columns:1fr}}
.pp-form input{width:100%;border:2px solid var(--line);border-radius:18px;padding:13px 16px;font:inherit;font-size:18px;background:#fff;color:var(--ink);margin-bottom:16px}
.pp-pick{display:flex;flex-wrap:wrap;gap:10px}
.pp-pick button{border:2px solid var(--pur);background:#fff;color:var(--pur);border-radius:30px;padding:6px 14px;font-family:'Readex Pro';font-size:14px;cursor:pointer;transition:.2s}
.pp-pick button.on{background:var(--pur);color:#fff;transform:scale(1.05)}
.pp{background:linear-gradient(160deg,#2f2557,#4a3d80);color:#fff;border-radius:26px;padding:22px;box-shadow:0 18px 40px rgba(47,37,87,.25);min-height:360px;position:relative;overflow:hidden}
.pp::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;border:30px solid rgba(255,255,255,.05);top:-80px;inset-inline-end:-80px}
.pp-top{display:flex;gap:12px;align-items:center;border-bottom:1px dashed rgba(255,255,255,.3);padding-bottom:14px}
.pp-top img{height:40px;background:#fff;border-radius:10px;padding:4px 8px}
.pp-top b{font-family:'Readex Pro';font-size:20px;display:block;color:var(--sun)}
.pp-top small{font-size:12px;opacity:.8}
.pp-name{margin:14px 0}.pp-name small{opacity:.7;font-size:12px}
.pp-name div{font-family:'Readex Pro';font-size:24px;min-height:38px}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:3px dashed rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;line-height:1.3}
.stamp.on{border:3px solid;animation:stamp .45s cubic-bezier(.3,1.6,.5,1)}
.stamp.on span{font-size:24px}
@keyframes stamp{0%{transform:scale(2.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.pp-foot{margin-top:16px;text-align:center;font-family:'Readex Pro';color:var(--sun);min-height:30px}
/* game */
.game{background:linear-gradient(135deg,var(--pur) 0%,var(--pur2) 100%);color:#fff;border-radius:30px;padding:40px 24px;text-align:center}
.q{font-family:'Readex Pro';font-size:clamp(20px,3.5vw,27px);min-height:90px;display:flex;align-items:center;justify-content:center;max-width:640px;margin:16px auto}
.prog{display:flex;gap:6px;justify-content:center}.prog i{width:28px;height:6px;border-radius:4px;background:rgba(255,255,255,.25)}.prog i.on{background:var(--sun)}
.opt{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.yes{background:var(--mint);color:var(--pur);box-shadow:0 6px 0 #04a57b}.no{background:var(--coral);color:#fff;box-shadow:0 6px 0 #d94f4f}
.go{background:var(--sun);color:var(--pur);box-shadow:0 6px 0 #e0b040}
.fb{margin-top:22px;min-height:60px}
.medal{font-size:76px;animation:bob 2s infinite}
/* wish */
.wishsec{background:linear-gradient(180deg,var(--cream),#e9f8ff)}
.wish{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
@media(max-width:760px){.wish{grid-template-columns:1fr}}
.wish textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:20px;padding:14px;font:inherit;font-size:17px;resize:none;margin:12px 0;background:#fff;color:var(--ink)}
.colors{display:flex;gap:10px;margin-bottom:14px}
.colors b{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.colors b.on{box-shadow:0 0 0 3px var(--pur)}
.stage{height:380px;position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:10px}
.big{width:230px;animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
.big.fly{animation:fly 2.4s ease-in forwards}
@keyframes sway{50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes fly{to{transform:translateY(-130vh) rotate(-12deg)}}
.big text{font-family:'Readex Pro';font-weight:600}
.sky{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sky span{background:#fff;border:2px solid var(--line);border-radius:20px;padding:4px 14px;font-size:14px}
/* message */
.dark{background:var(--pur);color:#fff;text-align:center}
.quote{font-family:'Readex Pro';font-size:clamp(22px,4vw,32px);line-height:1.6;min-height:110px;display:flex;align-items:center;justify-content:center;transition:opacity .3s;max-width:720px;margin:auto}
/* sign */
.sign{max-width:720px;margin:auto;background:#fff;border:2px solid var(--line);border-radius:28px;padding:10px 34px}
.row{display:flex;justify-content:space-between;align-items:center;padding:22px 0;gap:14px;flex-wrap:wrap}
.row+.row{border-top:2px solid var(--line)}
.row b{font-family:'Readex Pro';font-weight:400;font-size:19px}
.row span{border:2px dashed #d9d0ea;border-radius:12px;padding:10px 26px;color:var(--mute);font-size:18px}
/* footer */
footer{background:var(--pur);color:#d9d4ec;padding:60px 0 0;position:relative}
.fgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px}
@media(max-width:800px){.fgrid{grid-template-columns:1fr}}
.flogo{background:#fff;border-radius:18px;padding:10px 16px;display:inline-block;margin-bottom:14px}
.flogo img{height:56px;display:block}
footer h3{font-size:28px;color:#fff}
footer h4{font-family:'Readex Pro';color:var(--sun);font-size:17px;margin-bottom:10px}
.flinks{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:15px}
.copy{border-top:1px solid #4a3f7a;margin-top:40px;padding:18px 0;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:#aaa3c9}
.dots{height:8px;background:linear-gradient(90deg,var(--coral) 0 20%,var(--sun) 20% 40%,var(--mint) 40% 60%,var(--sky) 60% 80%,var(--pink) 80%)}
.reveal{opacity:0;transform:translateY(24px);transition:.8s}
.reveal.in{opacity:1;transform:none}
</style>
</head>

<section id="about"><div class="wrap">
  <div class="head reveal"><span class="k" style="background:var(--sky)" data-ar="عن المبادرة" data-en="About"></span>
    <h2 data-ar="لماذا نحتفي باليوم العالمي للطفل؟" data-en="Why celebrate World Children's Day?"></h2>
    <p data-ar="يوافق ٢٠ نوفمبر ذكرى اعتماد اتفاقية حقوق الطفل، وهو فرصة لنتعلم حقوقنا ونحترم حقوق غيرنا." data-en="November 20 marks the adoption of the Convention on the Rights of the Child — a chance to learn our rights and respect others'."></p></div>
  <div class="grid g3">
    <div class="box tint2 reveal"><div class="n" style="color:#f0a500">1954</div><h3 data-ar="بداية الاحتفاء" data-en="First celebrated"></h3><p data-ar="أول احتفاء عالمي بيوم الطفل." data-en="The first worldwide Children's Day."></p></div>
    <div class="box tint3 reveal"><div class="n" style="color:#1fa6d6">1989</div><h3 data-ar="اتفاقية حقوق الطفل" data-en="Rights Convention"></h3><p data-ar="اعتُمدت في مثل هذا اليوم لحماية حقوق كل طفل." data-en="Adopted on this day to protect every child's rights."></p></div>
    <div class="box tint1 reveal"><div class="n" style="color:#04a57b">٣</div><h3 data-ar="أهداف المبادرة" data-en="Our goals"></h3><p data-ar="أن تعرف الطالبة حقوقها، وتحترم حقوق غيرها، وتطلب المساعدة عند الحاجة." data-en="Know your rights, respect others' rights, and ask for help when needed."></p></div>
  </div>
</div></section>

<script>
let L='ar';
const COLORS=['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#ff8fc7','#9b7bff'];
function balloon(c,txt){return `<defs><radialGradient id="g${c.slice(1)}" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".85"/></radialGradient></defs>
 <path d="M115 268 C95 300 135 320 112 360" stroke="#2f2557" stroke-width="2" fill="none"/>
 <ellipse cx="115" cy="130" rx="100" ry="125" fill="url(#g${c.slice(1)})"/>
 <path d="M106 252 L124 252 L115 268Z" fill="${c}"/>
 <ellipse cx="78" cy="78" rx="18" ry="30" fill="#fff" opacity=".45" transform="rotate(-25 78 78)"/>
 ${txt?wrapText(txt):''}`}
function wrapText(t){const w=t.split(' '),lines=[];let cur='';w.forEach(x=>{if((cur+' '+x).trim().length>14){lines.push(cur.trim());cur=x}else cur+=' '+x});lines.push(cur.trim());
 return lines.slice(0,4).map((l,i)=>`<text x="115" y="${135-(Math.min(lines.length,4)-1)*14+i*28}" text-anchor="middle" fill="#2f2557" font-size="20">${l.replace(/</g,'')}</text>`).join('')}
// hero balloons
(function(){const h=document.getElementById('balloons');for(let i=0;i<9;i++){const c=COLORS[i%COLORS.length],s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 230 360');s.setAttribute('class','bl');s.innerHTML=balloon(c,'');s.style.left=(4+i*11)+'%';s.style.width=(46+Math.random()*40)+'px';s.style.animationDuration=(14+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*20)+'s';s.style.opacity=.85;h.appendChild(s)}})();
// rights
const rights=[
 {ic:'📚',c:'#ffd166',ar:['التعليم','من حقي أن أتعلم في مدرسة آمنة.'],en:['Education','I have the right to learn in a safe school.']},
 {ic:'⚽',c:'#06d6a0',ar:['اللعب','من حقي أن ألعب وأرتاح وأستمتع.'],en:['Play','I have the right to play, rest and have fun.']},
 {ic:'🩺',c:'#4cc9f0',ar:['الصحة','من حقي أن أحصل على الرعاية والغذاء الصحي.'],en:['Health','I have the right to care and healthy food.']},
 {ic:'🛡️',c:'#ff6b6b',ar:['الحماية','لا يحق لأحد أن يؤذيني أو يتنمر عليّ.'],en:['Protection','No one may hurt or bully me.']},
 {ic:'🗣️',c:'#b9a4ff',ar:['التعبير','من حقي أن أعبّر عن رأيي ويُسمع صوتي.'],en:['Expression','I have the right to share my opinion and be heard.']},
 {ic:'🏡',c:'#ffb38a',ar:['الأسرة','من حقي أن أعيش مع عائلة تحبني.'],en:['Family','I have the right to a loving family.']},
 {ic:'🪪',c:'#8fe3cf',ar:['الهوية','من حقي أن يكون لي اسم وجنسية.'],en:['Identity','I have the right to a name and nationality.']},
 {ic:'🤝',c:'#ff8fc7',ar:['المساواة','كل الأطفال متساوون في الحقوق.'],en:['Equality','All children have equal rights.']}];
function rRights(){document.getElementById('rights').innerHTML=rights.map((r,i)=>`<div class="card" onclick="this.classList.toggle('flip')"><div class="inner">
 <div class="face front" style="background:${r.c}"><div class="ic" style="animation-delay:${i*.2}s">${r.ic}</div><h3>${r[L][0]}</h3></div>
 <div class="face back"><div style="font-size:32px">${r.ic}</div><p>${r[L][1]}</p></div></div></div>`).join('')}
// game
const qs=[
 {ar:'أن أذهب إلى المدرسة وأتعلم',en:'Going to school to learn',a:1},
 {ar:'أن آخذ أغراض زميلتي دون إذنها',en:"Taking a classmate's things without asking",a:0},
 {ar:'أن ألعب وقت الفسحة',en:'Playing during recess',a:1},
 {ar:'أن أعبّر عن رأيي بأدب',en:'Sharing my opinion politely',a:1},

const T={y:{ar:'حق ✅',en:'A right ✅'},n:{ar:'ليس حقاً ❌',en:'Not a right ❌'},ok:{ar:'أحسنتِ! 🎉',en:'Well done! 🎉'},bad:{ar:'فكّري مرة أخرى 💭',en:'Think again 💭'},

let qi=-1,sc=0,lock=false;
function rGame(){const g=document.getElementById('gbody');
 if(qi<0){g.innerHTML=`<div class="q">${T.intro[L]}</div><button class="btn go" onclick="qi=0;sc=0;rGame()">${T.st[L]}</button>`;return}
 if(qi>=qs.length){g.innerHTML=`<div class="medal">🏅</div><h2>${T.done[L]}</h2><p style="font-size:20px">${T.sc[L]}: ${sc} / ${qs.length}</p><br><button class="btn go" onclick="qi=0;sc=0;rGame()">${T.ag[L]}</button>`;return}
 lock=false;g.innerHTML=`<div class="prog">${qs.map((_,i)=>`<i class="${i<=qi?'on':''}"></i>`).join('')}</div><div class="q">${qs[qi][L]}</div><div class="opt"><button class="btn yes" onclick="an(1)">${T.y[L]}</button><button class="btn no" onclick="an(0)">${T.n[L]}</button></div><div class="fb" id="fb"></div>`}
function an(v){if(lock)return;lock=true;const q=qs[qi],ok=v===q.a;if(ok)sc++;
 document.getElementById('fb').innerHTML=`<b>${ok?T.ok[L]:T.bad[L]}</b> ${q.a?T.r1[L]:T.r0[L]}<br><br><button class="btn go" onclick="qi++;rGame()">${T.nx[L]}</button>`}

function drawBig(t){big.innerHTML=balloon(wc,t)}

document.getElementById('wtext').oninput=e=>drawBig(e.target.value.trim()||T.here[L]);
document.getElementById('wbtn').onclick=()=>{const t=document.getElementById('wtext').value.trim();if(!t)return;
 drawBig(t);big.classList.add('fly');wishes.push(t);
 setTimeout(()=>{big.classList.remove('fly');document.getElementById('wtext').value='';wc=COLORS[(COLORS.indexOf(wc)+1)%COLORS.length];rColors();drawBig(T.sent[L]);
  document.getElementById('sky').innerHTML=wishes.map(w=>`<span>🎈 ${w.replace(/</g,'')}</span>`).join('')},2400)};
// passport
const picked=new Set();
function rPass(){
 document.getElementById('ppick').innerHTML=rights.map((r,i)=>`<button class="${picked.has(i)?'on':''}" onclick="tg(${i})">${r.ic} ${r[L][0]}</button>`).join('');
 document.getElementById('stamps').innerHTML=rights.map((r,i)=>picked.has(i)?`<div class="stamp on" style="color:${r.c};border-color:${r.c}"><span>${r.ic}</span>${r[L][0]}</div>`:`<div class="stamp"></div>`).join('');
 const n=document.getElementById('pname').value.trim();
 document.getElementById('pshow').textContent=n||'— — —';
 document.getElementById('pfoot').textContent=picked.size==rights.length?(L=='ar'?'🏅 جواز مكتمل! أنتِ سفيرة الحقوق':'🏅 Complete! You are a Rights Ambassador'):(picked.size?(L=='ar'?`${picked.size} من ${rights.length} أختام`:`${picked.size} of ${rights.length} stamps`):'');
}
function tg(i){picked.has(i)?picked.delete(i):picked.add(i);rPass()}
document.getElementById('pname').oninput=rPass;
// quotes
const quotes={ar:['صوتك مهم… لا تخافي أن تقوليه.','احترامك لحقوق غيرك هو أجمل حقوقك.','الطفولة ليست مرحلة… بل بصمة تبقى.','إذا شعرتِ بالخطر، اطلبي المساعدة فوراً.','كل طفل يستحق أن يكبر آمناً ومحبوباً.'],
 en:['Your voice matters… never fear using it.',"Respecting others' rights is your finest right.",'Childhood is not a phase… it is an imprint that stays.','If you feel unsafe, ask for help right away.','Every child deserves to grow up safe and loved.']};
let qn=0;function rQuote(){const e=document.getElementById('quote');e.style.opacity=0;setTimeout(()=>{e.textContent='« '+quotes[L][qn%5]+' »';e.style.opacity=1},250)}
document.getElementById('nextq').onclick=()=>{qn++;rQuote()};
function apply(){document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-ar]').forEach(e=>e.innerHTML=e.dataset[L]);
 document.getElementById('lang').textContent=L=='ar'?'EN':'عربي';document.getElementById('wtext').placeholder=T.ph[L];
 document.getElementById('pname').placeholder=L=='ar'?'اكتبي اسمك هنا':'Write your name here';rRights();rPass();rGame();rQuote();rColors();drawBig(document.getElementById('wtext').value.trim()||T.here[L])}
document.getElementById('lang').onclick=()=>{L=L=='ar'?'en':'ar';apply()};
const links=document.getElementById('links');document.getElementById('menu').onclick=()=>links.classList.toggle('open');
links.querySelectorAll('a').forEach(a=>a.onclick=()=>links.classList.remove('open'));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
apply();
</script>
</body>
</html>
